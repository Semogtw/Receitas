project_id = "receitas"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:4173/**",
]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_expiry = 86400

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[storage]
enabled = true
file_size_limit = "20MiB"

[storage.buckets.recipe-media]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/heic", "image/heif"]

[inbucket]
enabled = true
port = 54324
smtp_port = 54325

[functions.bootstrap]
verify_jwt = false

[functions.pair-invite]
verify_jwt = true

[functions.import-url]
verify_jwt = true

[functions.backup-restore]
verify_jwt = true

[functions.account-admin]
verify_jwt = true

[functions.permanent-delete]
verify_jwt = true
